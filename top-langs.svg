<svg
  width="495"
  height="195"
  viewBox="0 0 495 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #FFFFFF;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 600 13px 'Inter', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #CCCCCC;
    }
    .lang-pct {
      font: 400 13px 'Inter', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #888888;
    }
    .stagger {
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <!-- Fondo de la tarjeta con borde sutil oscuro -->
  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="194"
    width="494"
    stroke="#333333"
    fill="#000000"
    stroke-opacity="1"
  />

  <!-- Título con icono de código -->
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Barra de progreso segmentada -->
  <mask id="bar-mask">
    <rect x="25" y="55" width="445" height="9" rx="4.5" fill="white" />
  </mask>
  <g mask="url(#bar-mask)">
    <!-- TypeScript (34%) -> width 151.3 -->
    <rect x="25" y="55" width="151.3" height="9" fill="#3178C6" />
    <!-- JavaScript (28%) -> width 124.6 -->
    <rect x="176.3" y="55" width="124.6" height="9" fill="#F7DF1E" />
    <!-- Python (20%) -> width 89.0 -->
    <rect x="300.9" y="55" width="89.0" height="9" fill="#3776AB" />
    <!-- Tailwind CSS (10%) -> width 44.5 -->
    <rect x="389.9" y="55" width="44.5" height="9" fill="#06B6D4" />
    <!-- HTML / PostgreSQL (8%) -> width 35.6 -->
    <rect x="434.4" y="55" width="35.6" height="9" fill="#E34C26" />
  </g>

  <!-- Lista de Lenguajes en 2 Columnas -->
  <!-- Columna 1 -->
  <g transform="translate(25, 95)" class="stagger">
    <!-- 1. TypeScript -->
    <circle cx="5" cy="-4" r="5" fill="#3178C6" />
    <text x="18" y="0" class="lang-name">TypeScript <tspan class="lang-pct">34.0%</tspan></text>
  </g>
  <g transform="translate(25, 128)" class="stagger">
    <!-- 2. Python -->
    <circle cx="5" cy="-4" r="5" fill="#3776AB" />
    <text x="18" y="0" class="lang-name">Python <tspan class="lang-pct">20.0%</tspan></text>
  </g>
  <g transform="translate(25, 161)" class="stagger">
    <!-- 3. Tailwind / CSS -->
    <circle cx="5" cy="-4" r="5" fill="#06B6D4" />
    <text x="18" y="0" class="lang-name">Tailwind CSS <tspan class="lang-pct">10.0%</tspan></text>
  </g>

  <!-- Columna 2 -->
  <g transform="translate(260, 95)" class="stagger">
    <!-- 4. JavaScript -->
    <circle cx="5" cy="-4" r="5" fill="#F7DF1E" />
    <text x="18" y="0" class="lang-name">JavaScript <tspan class="lang-pct">28.0%</tspan></text>
  </g>
  <g transform="translate(260, 128)" class="stagger">
    <!-- 5. HTML / Web -->
    <circle cx="5" cy="-4" r="5" fill="#E34C26" />
    <text x="18" y="0" class="lang-name">HTML5 / Web <tspan class="lang-pct">5.0%</tspan></text>
  </g>
  <g transform="translate(260, 161)" class="stagger">
    <!-- 6. PostgreSQL -->
    <circle cx="5" cy="-4" r="5" fill="#4169E1" />
    <text x="18" y="0" class="lang-name">PostgreSQL / SQL <tspan class="lang-pct">3.0%</tspan></text>
  </g>
</svg>
